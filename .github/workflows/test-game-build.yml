name: Test Game Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-game-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run game build test
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          elif [ -f Makefile ]; then
            make
          else
            echo "No recognized build configuration found. Skipping build test."
          fi
