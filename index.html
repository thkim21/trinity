<dialog id="guide"><div class="guide-header"><div><span class="eyebrow">FIELD MANUAL</span><h2>\uC804\uC7A5 \uAC00\uC774\uB4DC</h2></div>${me("close","\uAC00\uC774\uB4DC \uB2EB\uAE30","close-guide")}</div><div class="guide-content"><p class="online-guide">\uBA40\uD2F0\uD50C\uB808\uC774\uB294 <b>\uBC29 \uB9CC\uB4E4\uAE30 \u2192 8\uC790\uB9AC \uBC29 \uCF54\uB4DC\uC640 6\uC790\uB9AC \uC785\uC7A5\uBC88\uD638 \uACF5\uC720</b>\uB85C \uC5F0\uACB0\uD569\uB2C8\uB2E4. \uCD5C\uB300 8\uBA85\uC774 \uCC38\uAC00\uD558\uBA70 \uAC1C\uC778\uC804\uACFC \uD300\uB2F9 \uCD5C\uB300 4\uBA85\uC778 A~D \uD300\uC804\uC744 \uC9C0\uC6D0\uD569\uB2C8\uB2E4. \uBC29\uC7A5\uC774 \uBE48\uC790\uB9AC\uC5D0 AI\uB97C \uCD94\uAC00\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uBAA8\uB4E0 \uC0AC\uC6A9\uC790\uAC00 \uC900\uBE44\uD558\uBA74 \uC2DC\uC791\uD569\uB2C8\uB2E4. \uC628\uB77C\uC778\uC5D0\uC11C\uB294 \uBA54\uB274\uB97C \uC5F4\uC5B4\uB3C4 \uC2DC\uAC04\uC774 \uD750\uB974\uBA70, 60\uCD08 \uB3D9\uC548 \uC5F0\uACB0\uC774 \uC5C6\uC73C\uBA74 \uAE30\uAD8C \uCC98\uB9AC\uB429\uB2C8\uB2E4. \uC77C\uC2DC\uC801\uC778 \uC5F0\uACB0 \uBB38\uC81C\uB294 \uC790\uB3D9 \uBCF5\uAD6C\uD558\uACE0 \uAC19\uC740 \uD0ED\uC744 \uC0C8\uB85C\uACE0\uCE68\uD574\uB3C4 \uBCF5\uADC0\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.</p><p class="guide-lead">AI \uAD50\uC804\uC5D0\uC11C\uB294 \uB2E4\uB978 \uB450 \uC885\uC871\uC758 <b>\uC0AC\uB839\uBD80</b>\uB97C \uBAA8\uB450 \uD30C\uAD34\uD558\uBA74 \uC2B9\uB9AC\uD569\uB2C8\uB2E4. \uB0B4 \uC0AC\uB839\uBD80\uAC00 \uBA3C\uC800 \uD30C\uAD34\uB418\uBA74 \uD328\uBC30\uD569\uB2C8\uB2E4.</p><div class="guide-columns"><section><h3>01. \uAE30\uC9C0 \uC6B4\uC601</h3><p>\uC77C\uAFBC\uC740 \uAD11\uC11D\uACFC \uC218\uC815\uC744 \uCC44\uC9D1\uD574 \uC0AC\uB839\uBD80\uB85C \uC6B4\uBC18\uD569\uB2C8\uB2E4. <b>\uC77C\uAFBC \uC120\uD0DD \u2192 \uAC74\uC124 \u2192 \uBE48 \uB545 \uD0ED</b>\uC73C\uB85C \uAC74\uBB3C\uC744 \uC138\uC6B0\uC138\uC694. \uAC74\uC124\uC5D0\uB294 \uC77C\uAFBC\uC774 \uD544\uC694\uD569\uB2C8\uB2E4.</p><p><b>\uC0AC\uB839\uBD80</b>\uC5D0\uC11C \uC77C\uAFBC, <b>\uBCD1\uC601</b>\uC5D0\uC11C \uC804\uD22C \uC720\uB2DB\uC744 \uC0DD\uC0B0\uD569\uB2C8\uB2E4. <b>\uBCF4\uAE09\uC18C</b>\uB294 \uC778\uAD6C \uD55C\uB3C4\uB97C 10 \uB298\uB9BD\uB2C8\uB2E4. \uCD5C\uB300 \uC778\uAD6C\uB294 AI \uAD50\uC804 90, \uC628\uB77C\uC778 \uB300\uC804 60\uC785\uB2C8\uB2E4.</p><p><b>\uC5F0\uAD6C\uC18C</b> \uAC74\uC124 \uD6C4 II\uB2E8\uACC4\uB85C \uBC1C\uC804\uD558\uBA74 \uAE30\uB3D9\uBCD1\xB7\uACF5\uC131\uD3EC\uC640 \uAD70\uC218 \uACF5\uC7A5\xB7\uC9C0\uC6D0 \uC911\uACC4\uC18C\uAC00 \uD574\uAE08\uB429\uB2C8\uB2E4. \uB450 \uACE0\uAE09 \uAC74\uBB3C\uC744 \uC644\uC131\uD558\uACE0 III\uB2E8\uACC4\uB85C \uBC1C\uC804\uD558\uBA74 \uD0C0\uC774\uD0C4\uC744 \uC0DD\uC0B0\uD569\uB2C8\uB2E4. \uBC1C\uC804 \uB2E8\uACC4\uB9C8\uB2E4 \uAE30\uBCF8 \uCCB4\uB825 +18%, \uACF5\uACA9\uB825 +20%\uAC00 \uC801\uC6A9\uB429\uB2C8\uB2E4. \uAC10\uC2DC\uD0D1\uC740 \uADFC\uCC98 \uC801\uC744 \uC790\uB3D9 \uACF5\uACA9\uD569\uB2C8\uB2E4. \uC0C1\uB2E8 \uCC45 \uBAA8\uC591 \uBC84\uD2BC\uC5D0\uC11C \uD14C\uD06C\uD2B8\uB9AC\uC640 \uAC1C\uBCC4 \uC5F0\uAD6C\uB97C \uD655\uC778\uD558\uC138\uC694.</p><h3>02. \uC885\uC871 \uC0C1\uC131</h3><div class="race-cycle">\uCCA0\uD608 \u2192 \uAD70\uB77D \u2192 \uC131\uD718 \u2192 \uCCA0\uD608</div><p>\uD654\uC0B4\uD45C \uBC29\uD5A5\uC758 \uC0C1\uB300\uC5D0\uAC8C \uD53C\uD574\uAC00 <b>25%</b> \uC99D\uAC00\uD569\uB2C8\uB2E4. \uCCA0\uD608\uC740 \uB192\uC740 \uCCB4\uB825\uACFC \uC7A5\uAC11, \uAD70\uB77D\uC740 \uC800\uB834\uD55C \uC0DD\uC0B0\uACFC \uCCB4\uB825 \uC7AC\uC0DD, \uC131\uD718\uB294 \uAE34 \uC0AC\uAC70\uB9AC\uC640 \uC7AC\uC0DD \uBCF4\uD638\uB9C9\uC774 \uD2B9\uC9D5\uC785\uB2C8\uB2E4.</p></section><section><h3>03. \uBCD1\uC885 \uC0C1\uC131</h3><div class="race-cycle">\uCC3D\uBCD1 \u2192 \uAE30\uB3D9\uBCD1 \u2192 \uC0AC\uC218 \u2192 \uCC3D\uBCD1</div><p>\uC720\uB9AC\uD55C \uBCD1\uC885\uC5D0\uAC8C \uD53C\uD574\uAC00 <b>40%</b> \uC99D\uAC00\uD569\uB2C8\uB2E4. \uACF5\uC131\uD3EC\uB294 \uAC74\uBB3C\uC5D0 <b>2.3\uBC30</b> \uD53C\uD574\uB97C \uC90D\uB2C8\uB2E4. \uC885\uC871 \uC0C1\uC131\uACFC \uBCD1\uC885 \uC0C1\uC131\uC740 \uACF1\uD574\uC9D1\uB2C8\uB2E4. \uACF5\uC131\uD3EC\uB294 \uD0C0\uC774\uD0C4\uC5D0 \uD53C\uD574 +50%, \uD0C0\uC774\uD0C4\uC740 \uCC3D\uBCD1\uC5D0 +40%, \uAE30\uB3D9\uBCD1\uC740 \uC9C0\uC6D0\uAE30\uC5D0 +40%\uC785\uB2C8\uB2E4. \uBC1D\uC740 \uD14C\uB450\uB9AC\uC758 \uACE0\uC9C0\uC5D0\uC11C \uB0AE\uC740 \uC9C0\uD615\uC744 \uACF5\uACA9\uD558\uB294 \uC6D0\uAC70\uB9AC \uC720\uB2DB\uC740 \uAC00\uD558\uB294 \uD53C\uD574 +12%\uAC00 \uC801\uC6A9\uB429\uB2C8\uB2E4.</p><h3>04. PC \xB7 \uD130\uCE58 \uC870\uC791</h3><p><b>PC:</b> \uD074\uB9AD \uC120\uD0DD, \uB4DC\uB798\uADF8 \uB2E4\uC911 \uC120\uD0DD, Shift\uB85C \uCD94\uAC00 \uC120\uD0DD. \uC6B0\uD074\uB9AD\uC73C\uB85C \uC774\uB3D9\xB7\uCC44\uC9D1\xB7\uACF5\uACA9. A \uACF5\uACA9 \uC774\uB3D9, M \uC774\uB3D9, S \uC815\uC9C0, B \uAC74\uC124, Q/W/E/R \uC0DD\uC0B0\xB7\uAC74\uC124, \uBC29\uD5A5\uD0A4 \uD654\uBA74 \uC774\uB3D9. Ctrl+1~3 \uBD80\uB300 \uC9C0\uC815, 1~3 \uD638\uCD9C.</p><p><b>\uBAA8\uBC14\uC77C:</b> \uC544\uAD70\uC744 \uD0ED\uD574 \uC120\uD0DD\uD558\uACE0 \uBAA9\uC801\uC9C0\xB7\uC790\uC6D0\xB7\uC801\uC744 \uD0ED\uD574 \uBA85\uB839\uD569\uB2C8\uB2E4. \uD654\uBA74\uC744 \uB4DC\uB798\uADF8\uD574 \uC774\uB3D9\uD558\uACE0, \uB450 \uC190\uAC00\uB77D\uC73C\uB85C \uD655\uB300\xB7\uCD95\uC18C\uD569\uB2C8\uB2E4. \uC544\uB798 <b>\uD654\uBA74 \uC774\uB3D9</b> \uBC84\uD2BC\uC744 \uB20C\uB7EC <b>\uB4DC\uB798\uADF8 \uC120\uD0DD</b>\uC73C\uB85C \uC804\uD658\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.</p><p><b>\uACF5\uACA9 \uC774\uB3D9:</b> \uBAA9\uC801\uC9C0\uAE4C\uC9C0 \uC774\uB3D9\uD558\uBA74\uC11C \uB9C8\uC8FC\uCE58\uB294 \uC801\uC744 \uACF5\uACA9\uD569\uB2C8\uB2E4. \uC0DD\uC0B0 \uB300\uAE30\uC5F4\uC744 \uB204\uB974\uBA74 \uD574\uB2F9 \uC0DD\uC0B0\uC774 \uCDE8\uC18C\uB418\uACE0 \uC790\uC6D0\uC774 \uB3CC\uC544\uC635\uB2C8\uB2E4. \uBBF8\uB2C8\uB9F5\uC758 \uC801 \uC0AC\uB839\uBD80 \uC704\uCE58\uB294 \uCC98\uC74C\uBD80\uD130
